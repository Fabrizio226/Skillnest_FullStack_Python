<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Mercado de Frutas</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        <i class="bi bi-apple me-1"></i> Mercado de Frutas
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('catalogo') }}">Catálogo</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Header -->
  <header class="hero text-center text-white py-5 bg-success bg-gradient">
    <div class="container py-2">
      <h1 class="display-4 fw-bold mb-2">Nuestro Catálogo</h1>
      <p class="lead mb-0">Explora la variedad de productos frescos que tenemos para ti.</p>
    </div>
  </header>

  <!-- Catálogo de Productos -->
  <main class="container my-5">
    <div class="row g-4">
      {% for fruta in frutas %}
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="{{ url_for('static', filename='img/' + fruta.imagen) }}" 
               class="card-img-top object-fit-cover" 
               alt="{{ fruta.nombre }}"
               style="height: 200px;">
          <div class="card-body d-flex flex-column text-center">
            <h5 class="card-title fw-bold mb-1">{{ fruta.nombre }}</h5>
            <p class="text-success fw-semibold mb-2">${{ "%.2f"|format(fruta.precio) }} / kg</p>
            <p class="card-text text-muted small flex-grow-1">{{ fruta.descripcion }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="text-center mt-5">
      <a href="{{ url_for('index') }}" class="btn btn-success btn-lg fw-semibold">
        <i class="bi bi-cart me-2"></i>Ir a comprar
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
