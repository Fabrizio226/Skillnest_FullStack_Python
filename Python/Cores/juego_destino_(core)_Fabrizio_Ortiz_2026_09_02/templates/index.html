<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon-badge"><i class="fa-solid fa-moon"></i></div>
            <h1>El Juego del Destino</h1>
            <p class="subtitle">Descubre qué te depara el futuro</p>
        </div>
        
        <form action="/enviar" method="POST">
            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="number" name="edad" placeholder="Tu edad" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-globe"></i>
                    <input type="text" name="color" placeholder="Tu color favorito" required>
                </div>
                <small>Ej. rojo, azul, verde, morado, amarillo...</small>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-paw"></i>
                    <input type="text" name="animal" placeholder="Tu animal favorito" required>
                </div>
                <small>Ej. perro, gato, águila, león, delfín...</small>
            </div>

            <div class="sphere-container">
                <div class="crystal-ball"></div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-pen"></i> Revelar mi destino
            </button>
        </form>
    </div>
</body>
</html>
